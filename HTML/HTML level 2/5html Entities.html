<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Html entities</title>
  </head>
  <body>
    <!-- &lt use for printing less than sign -->
    <p>a &lt; b</p>
    <!-- &gt use for printing greater than sign -->
    <p>a &gt; b</p>
    <!-- &amp use for printing and sign -->
    <p>a &amp; b</p>
    <!-- &quot use for printing double quotes sign -->
    <p>a &quot;b &quot;</p>
    <!-- &bigstar use for printing bigstar sign -->
    <h1>This is a &bigstar;</h1>
  </body>
</html>
