<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- less than symbol is used to create parent child relationship -->
     <p>
        <div></div>
     </p>
     <!-- plus sign is used to create siblings mean one parent has direct two children at same level -->
      <p>
        <div></div>
        <img src="" alt="">
      </p>
      <!-- star sign is used to create any tag multiple times -->
       <ul>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
       </ul>
</body>
</html>
